<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://api.github.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0a0d0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LabDash">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css?v=1">
<title>LabDash</title>
</head>
<body>

<main id="lock" class="lock">
  <div class="lock-card">
    <div class="brand"><img src="icons/icon-192.png" alt="" width="44" height="44"><h1>LabDash</h1></div>
    <p class="sub" id="lockSub">Checking this device…</p>

    <form id="unlockForm" hidden autocomplete="off">
      <label for="unlockPass">Passphrase</label>
      <input id="unlockPass" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required>
      <label class="check"><input type="checkbox" id="unlockRemember" checked> Keep unlocked on this device</label>
      <button class="primary" type="submit">Unlock</button>
      <p class="hint" id="unlockHint"></p>
    </form>

    <div id="startChoice" hidden>
      <button class="primary" id="startNew" type="button">Start a new LabDash</button>
      <button class="ghost" id="startJoin" type="button">Join one that's already synced</button>
      <p class="fine">Everything is encrypted on this device with your passphrase before it goes anywhere.</p>
    </div>

    <form id="newForm" hidden autocomplete="off">
      <label for="newPass">Choose a passphrase</label>
      <input id="newPass" type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false" minlength="10" required>
      <label for="newPass2">Type it again</label>
      <input id="newPass2" type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false" required>
      <label class="check"><input type="checkbox" id="newRemember" checked> Keep unlocked on this device</label>
      <p class="fine">At least 10 characters. There is no reset: keep it in a password manager.</p>
      <button class="primary" type="submit">Create</button>
      <button class="link" type="button" data-back>Back</button>
      <p class="hint" id="newHint"></p>
    </form>

    <form id="joinForm" hidden autocomplete="off">
      <label for="joinRepo">Private data repository</label>
      <input id="joinRepo" placeholder="your-username/LabDash-data" autocapitalize="off" spellcheck="false" required>
      <label for="joinToken">Access token</label>
      <input id="joinToken" type="password" autocapitalize="off" spellcheck="false" required>
      <label for="joinPass">Passphrase</label>
      <input id="joinPass" type="password" autocapitalize="off" spellcheck="false" required>
      <label class="check"><input type="checkbox" id="joinRemember" checked> Keep unlocked on this device</label>
      <button class="primary" type="submit">Join</button>
      <button class="link" type="button" data-back>Back</button>
      <p class="hint" id="joinHint"></p>
    </form>
  </div>
</main>

<div id="app" hidden>
  <header class="top">
    <button class="icon-btn" id="backBtn" type="button" aria-label="Back" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="titles"><h1 id="title">LabDash</h1><p id="subtitle"></p></div>
    <button class="sync-pill" id="syncPill" type="button" aria-label="Sync status"><span class="dot"></span><span id="syncText">Local</span></button>
  </header>
  <section id="view" class="view" aria-live="polite"></section>
  <nav class="tabs" id="tabs" aria-label="Sections">
    <button type="button" data-tab="home" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg><span>Home</span></button>
    <button type="button" data-tab="projects"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h7l2 2h9v10H3z"/></svg><span>Projects</span></button>
    <button type="button" data-tab="capture" class="fab" aria-label="New log entry or photo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button type="button" data-tab="lab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/></svg><span>Lab</span></button>
    <button type="button" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span>Settings</span></button>
  </nav>
</div>

<div id="sheet" class="sheet" hidden><div class="sheet-card" role="dialog" aria-modal="true"><div id="sheetBody"></div></div></div>
<div id="viewer" class="viewer" hidden><img id="viewerImg" alt=""><button class="icon-btn close" id="viewerClose" type="button" aria-label="Close">✕</button></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="vendor/xlsx.full.min.js" defer></script>
<script src="app.js?v=1" defer></script>
</body>
</html>
